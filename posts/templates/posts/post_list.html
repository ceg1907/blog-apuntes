<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Apuntes</h1>

    {% for post in posts %}
    <h2><a href="{% url 'post_detail' post.pk %}">{{ post.titulo }}</a></h2>
    <p>{{ post.get_categoria_display }} · {{ post.autor }} · {{ post.fecha_creacion|date:"d/m/Y" }}</p>
    {% if post.imagen %}
    <img src="{{ post.imagen.url }}" width="300">
    {% endif %}
    <hr>
    {% empty %}
    <p>Todavía no hay apuntes.</p>
    {% endfor %}
</body>

</html>
