<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <a href="{% url 'post_list' %}">← Volver</a>

    <h1>{{ post.titulo }}</h1>
    <p>{{ post.get_categoria_display }} · {{ post.autor }} · {{ post.fecha_creacion|date:"d/m/Y" }}</p>

    {% if post.imagen %}
    <img src="{{ post.imagen.url }}" width="500">
    {% endif %}

    <p>{{ post.contenido|linebreaks }}</p>
</body>

</html>
